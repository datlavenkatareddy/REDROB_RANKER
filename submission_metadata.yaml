ai_usage_summary: |
  Used Claude for architecture design, feature engineering, honeypot-pattern
  calibration against the real released dataset, and code implementation.
  All design decisions (title-as-gate scoring, dynamic weight normalization,
  honeypot detection thresholds) were validated against the actual 100K
  candidate pool during development, not assumed. No candidate data was sent
  to any external LLM API — the ranking pipeline itself makes no network
  calls.

methodology_summary: |
  Hybrid rule-based ranker, no LLM calls at ranking time. Title is treated as
  a gate (irrelevant titles are multiplicatively suppressed regardless of
  skill list length) — the primary defense against keyword-stuffer traps.
  Content score combines title fit, skill match (exact/substring, optionally
  blended with sentence-transformer cosine similarity), career-history
  evidence of shipped ranking/search/retrieval work, experience-band fit,
  location, and education, with dynamic weight renormalization when a
  section is missing from a profile. Redrob behavioral signals apply as a
  bounded multiplier (0.55x-1.0x) on top of content score, not an additive
  term, so unreachable perfect-on-paper candidates don't outrank reachable
  slightly-weaker ones. Honeypots are detected via two internal-consistency
  checks confirmed against the real dataset (expert-proficiency-with-zero-
  duration skills; career-history duration exceeding stated total
  experience) and excluded outright. Full 100K pool runs in ~40 seconds,
  single CPU core, no GPU, no network.

